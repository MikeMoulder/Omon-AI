# reading all 562 lines of developers.binance.com/en/docs/agent-native/mcp-server/agentic.md
# — zero matches for testnet|demo|sandbox|paper|simulat. The only funding language is
# "this is the step that spends real funds".
# Binance Spot Testnet (testnet.binance.vision) exists with free virtual funds, but it is a
# SEPARATE system: own API key, REST only, not wired to Agent OS or your real account.
