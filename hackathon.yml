# Binance Agent OS Mini Hackathon — filled from hackathon_requirement.md + what_is_agentOS.md
# Filled 2026-09-04 by /skillz:ideation. Edit this, not the plugin's CONFIG.md.

hackathon:
  name:            Binance Agent OS Mini Hackathon
  theme:           "We built Agent OS. You build what's next."
  url:             https://x.com/binance/status/2094810011557838988
  tracks:
    - name:        "Track A — Build an AI agent with Agent OS"
      pool:        20000 USDC
      structure:   "1st 2000 / 2nd 1500 / 3rd 1000 / next 50 winners 300 each"
      judged:      true
      modules:     [data-and-analysis, trading-workflows, payment-workflows, onchain-workflows]
    - name:        "Track B — Connect your MCP and trade"
      pool:        40000 USDC
      structure:   "first 10,000 eligible users x 4 USDC — completion, not judged"
      tasks:       [spot-trade, futures-trade, "margin-or-convert-trade"]
  format:          online
  size:            large        # public X-reply submission + 53 paid Track A slots => high entry count

sponsors:
  - name:          Binance
    tech:          "Binance MCP server, Exchange REST/WS APIs, Binance Pay (x402), Agentic Wallet, Web3 APIs, Skill Hub, AI Pro"
    prize:         60000 USDC
    must_use:      true
target_tracks:     2            # A judged + B completion. B is the same MCP connection A needs.

team:
  size:            1            # ASSUMED — correct this if wrong, it changes the scope math
  strengths:       [frontend, backend]
  known_stack:     [next.js, typescript, tailwind, shadcn, node, postgres]
  new_tech_ok:     true

time:
  total_hours:     108          # 2026-09-04 -> 2026-09-08 23:59 UTC
  build_hours:     34           # ASSUMED solo, ~8h/day, minus video/README/submission
  ideation_cap_min: 60

requires:
  deployed_url:    false        # not required; GitHub + video are
  video:           true         # demo video, posted as X reply/quote-repost
  open_source:     true         # GitHub link "if applicable" — treat as required
  hardware:        none

strategy:
  risk:            balanced
  domain:          ai-agents
  avoid:           [dashboard, chatbot-wrapper, marketplace, backtesting-suite]
  novelty_floor:   6

rubric:                         # no official weights published — skill defaults
  demo_wow:        20
  technical:       20
  innovation:      15
  tech_integration: 15
  impact:          15
  feasibility:     15

# ── HARD ELIGIBILITY GATE — verify before writing more code ──────────────────
# Campaign excluded in: US, UK, EEA, Hong Kong, Singapore + Binance prohibited list.
# Requires a Binance account able to create an Agentic sub-account.
